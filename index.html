<!DOCTYPE HTML>
<html>
	<head>
            <meta charset="utf-8">
            <!-- Global site tag (gtag.js) - Google Analytics -->
            <script async src="https://www.googletagmanager.com/gtag/js?id=UA-83325513-2"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());

              gtag('config', 'UA-83325513-2');
            </script>

            <title>Trevor Aquino</title>
            <link rel = "stylesheet" type = "text/css" href = "assets/css/main.css">
            <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
            <link rel="icon" type="image/png" sizes="96x96" href="favicons.ico/favicon-96x96.png">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <script type="importmap">
            {
              "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
              }
            }
            </script>
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	</head>
	<body>
        <div id = 'content'>
            <h1>Hi! I'm <span id="name">Trevor Aquino</span></h1>
            <ul>
                <li>Member of Technical Staff at 
                    <p><a id="decagon" href = "https://decagon.ai" target="_blank">Decagon</a></p>
                </li>
                <li>Previously at 
                    <p><a id="figma" href = "https://www.figma.com" target="_blank">Figma</a></p>,
                    <p><a id="janestreet" href = "https://www.janestreet.com" target="_blank">Jane Street</a></p>, and
                    <p><a id="stripe" href = "https://stripe.com" target="_blank">Stripe</a></p>
                </li>
                <li>Ultimate frisbee enjoyer with 
                    <p><a id="abbq" href = "https://www.instagram.com/abbqfamily/" target="_blank">ABBQ</a></p>
                </li>
                <li>
                    <p><a id="linkedin" href = "https://www.linkedin.com/in/trevoraquino/" target="_blank">LinkedIn</a></p>,
                    <p><a id="github" href = "https://github.com/trev4ev" target="_blank">GitHub</a></p>,
                    <p><a id="resume" href = "Trevor_Aquino_Resume.pdf" target="_blank">Resume</a></p>,
                    <p><a id="contact" href = "mailto:trevoraquino@gmail.com" target="_blank">Contact</a></p>
                </li>
            </ul>
        </div>
        <section id="ultimate">
            <div id="ultimate-stage">
                <canvas id="ultimate-field"></canvas>
            </div>
        </section>
        <div id="score-name-modal" hidden>
            <form
                id="score-name-form"
                autocomplete="off"
                data-1p-ignore
                data-lpignore="true"
                data-bwignore="true"
                data-form-type="other"
            >
                <button
                    type="button"
                    id="score-name-close"
                    aria-label="Skip saving score"
                    title="Skip"
                >
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path
                            d="M6 6l12 12M18 6L6 18"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.4"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>
                <p id="score-name-summary">You scored 0 throws!</p>
                <div id="score-name-row">
                    <input
                        id="score-name-input"
                        name="ultimate-board-handle"
                        type="text"
                        maxlength="12"
                        minlength="1"
                        required
                        spellcheck="false"
                        placeholder="Your name"
                        aria-label="Your name"
                        autocomplete="one-time-code"
                        autocapitalize="off"
                        autocorrect="off"
                        data-1p-ignore
                        data-lpignore="true"
                        data-bwignore="true"
                        data-form-type="other"
                    />
                    <button
                        type="button"
                        id="score-name-random"
                        aria-label="Random name"
                        title="Random name"
                    >
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/>
                            <circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/>
                            <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
                            <circle cx="8.5" cy="15.5" r="1.4" fill="currentColor"/>
                            <circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
                <p id="score-name-error" hidden></p>
                <button type="submit" id="score-name-submit">Save score</button>
            </form>
        </div>
        <script src="assets/js/ultimate-logic.js"></script>
        <script src="assets/js/ultimate-scores.js"></script>
        <script type="module" src="assets/js/ultimate.js"></script>
	</body>
</html>
